services:
  - type: web
    name: marketo-api-simulator
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: local
      - key: LOG_LEVEL
        value: INFO
      - key: MOCK_CLIENT_ID
        value: marketo-poc-client
      - key: MOCK_CLIENT_SECRET
        value: change-me
      - key: TOKEN_HASH_SECRET
        value: marketo-simulator-secret-token-hash-key-2026
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "3599"
      - key: QUEUE_DELAY_SECONDS
        value: "2"
      - key: PROCESSING_DELAY_SECONDS
        value: "5"
      - key: MAX_EXPORT_RANGE_DAYS
        value: "30"
      - key: MAX_ACTIVE_EXPORT_JOBS
        value: "10"
      - key: MIN_RECORDS_PER_DAY
        value: "1"
      - key: MAX_RECORDS_PER_DAY
        value: "5"
      - key: MAX_RECORDS_PER_EXPORT
        value: "10000"
